name: Claude PR Review

# Automated code review on every PR. Unlike the packaged /code-review
# skill this used to call, there is no "is this worth reviewing" gate —
# every non-draft PR gets reviewed and always gets exactly one summary
# comment, however small or "obviously correct" the change looks.
# Why: see docs/workflow-decisions.md.
#
# Needs a repo secret CLAUDE_CODE_OAUTH_TOKEN (generate with
# `claude setup-token` against a Pro/Max/Team/Enterprise subscription) —
# someone with admin access has to add that once; this workflow does
# nothing without it. Runs against that person's personal subscription
# usage, not separate API billing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Always review it and always post a summary comment, no matter
            how small, trivial, "obviously correct", automated, or
            merge-commit-only the change looks. Never decide the PR
            doesn't need a review and never skip commenting for any
            reason.

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the full change.
            2. Check the diff for real bugs, and for compliance with any
               relevant CLAUDE.md files (the root CLAUDE.md, plus any in
               directories the PR touches). Only flag concrete,
               high-confidence issues — not style nitpicks, speculative
               concerns, or things a linter would already catch.
            3. If an issue is tied to a specific line, you may also post an
               inline comment on that line with
               mcp__github_inline_comment__create_inline_comment, in
               addition to (never instead of) the summary comment below.
            4. Always run exactly one
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
               with a summary comment formatted exactly as:

               ## Code review

               **What was reviewed:**
               <one or two sentences on what the PR actually changes>

               **Review results:**
               <bulleted list of issues found, or "No issues found." if none>
