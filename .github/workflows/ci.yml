name: CI

# Runs on every pull request, and on main after a merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  guardrails:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is committed. Remove it with 'git rm --cached' and rotate anything in it."
            exit 1
          fi

      - name: Fail if an AWS access key appears in the code
        run: |
          if git grep -nE '(AKIA|ASIA)[A-Z0-9]{16}'; then
            echo "::error::Something that looks like an AWS access key is committed. Remove it and deactivate the key."
            exit 1
          fi
